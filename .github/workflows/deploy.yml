name: Generate and deploy Architecture City

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public-safe repository map
        run: node scripts/generate-city-map.mjs

      - name: Validate generated map
        run: node scripts/validate-city-map.mjs

      - name: Commit refreshed city data
        run: |
          if git diff --quiet -- architecture-map.json architecture-city-summary.json source-manifest.json; then
            echo "City data already matches this checkout."
            exit 0
          fi
          git config user.name "architecture-city[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json architecture-city-summary.json source-manifest.json
          git commit -m "chore: refresh architecture city map"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
